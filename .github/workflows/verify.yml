name: Verify recreation (MATLAB / Simulink)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

# Every job runs MATLAB code only (simulink/ci_run.m). Each job pushes its output
# folder to the branch ci-out/<job> (.github/push_results.sh); the report job
# collects everything on the branch ci-results.

env:
  MATLAB_RELEASE: R2025a
  MATLAB_PRODUCTS: Simulink Simscape Simscape_Electrical Control_System_Toolbox Simulink_Control_Design
  COMPAT_RELEASE: R2022b
  COMPAT_PRODUCTS: Simulink Simscape Simscape_Electrical

jobs:
  reference:
    name: MATLAB reference and paper analysis
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Virtual display and fonts (figure export)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-liberation fonts-dejavu-core > /dev/null
          Xvfb :99 -screen 0 2560x1600x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ env.MATLAB_RELEASE }}
          products: ${{ env.MATLAB_PRODUCTS }}
          cache: true
      - name: matlab/run_all.m, scenario reference of matlab/boost_sim.m, paper checks
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('simulink'); ci_run('reference')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference
          path: results/reference/
          if-no-files-found: ignore
      - name: Push output to branch ci-out/reference
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/push_results.sh results/reference ci-out/reference

  simulink:
    name: Simulink ${{ matrix.plant }} vs reference and paper
    needs: reference
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        plant: [diffeq, sps]
    steps:
      - uses: actions/checkout@v4
      - name: Virtual display and fonts (figure and diagram export)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-liberation fonts-dejavu-core > /dev/null
          Xvfb :99 -screen 0 2560x1600x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ env.MATLAB_RELEASE }}
          products: ${{ env.MATLAB_PRODUCTS }}
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: reference
          path: results/reference/
      - name: Build the models, run every scenario, compare with the reference and the paper
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('simulink'); ci_run('simulink', '${{ matrix.plant }}')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulink-${{ matrix.plant }}
          path: results/simulink_${{ matrix.plant }}/
          if-no-files-found: ignore
      - name: Push output to branch ci-out/simulink-${{ matrix.plant }}
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/push_results.sh results/simulink_${{ matrix.plant }} ci-out/simulink-${{ matrix.plant }}

  frestimate:
    name: Frequency response with frestimate (Section II-A)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Virtual display and fonts (figure export)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-liberation fonts-dejavu-core > /dev/null
          Xvfb :99 -screen 0 2560x1600x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ env.MATLAB_RELEASE }}
          products: ${{ env.MATLAB_PRODUCTS }}
          cache: true
      - name: frestimate on the circuit model, amplitudes 0.03 and 0.0005
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('simulink'); ci_run('frestimate')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frestimate
          path: results/frestimate/
          if-no-files-found: ignore
      - name: Push output to branch ci-out/frestimate
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/push_results.sh results/frestimate ci-out/frestimate

  compat:
    name: Build and run in an older MATLAB (R2022b)
    needs: reference
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ env.COMPAT_RELEASE }}
          products: ${{ env.COMPAT_PRODUCTS }}
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: reference
          path: results/reference/
      - name: Build every model and run a subset of the scenarios
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('simulink'); ci_run('compat')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-${{ env.COMPAT_RELEASE }}
          path: results/compat_${{ env.COMPAT_RELEASE }}/
          if-no-files-found: ignore
      - name: Push output to branch ci-out/compat
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/push_results.sh results/compat_${{ env.COMPAT_RELEASE }} ci-out/compat

  report:
    name: Summary and ci-results branch
    needs: [reference, simulink, frestimate, compat]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ci/
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ env.MATLAB_RELEASE }}
          products: ${{ env.MATLAB_PRODUCTS }}
          cache: true
      - name: Write the summary (simulink/ci_report.m)
        uses: matlab-actions/run-command@v2
        env:
          JOB_RESULTS: >-
            reference=${{ needs.reference.result }}
            simulink=${{ needs.simulink.result }}
            frestimate=${{ needs.frestimate.result }}
            compat-${{ env.COMPAT_RELEASE }}=${{ needs.compat.result }}
        with:
          command: addpath('simulink'); ci_run('report', 'ci', getenv('JOB_RESULTS'))
      - name: Job summary
        if: always()
        run: |
          if [ -f ci/SUMMARY.md ]; then cat ci/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Publish models, figures and tables to the ci-results branch
        if: always()
        run: |
          rm -rf ci/reference/traces_reference
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-results-tmp
          git rm -rf --cached . > /dev/null
          git add -f ci
          git commit -q -m "CI results of run ${{ github.run_number }} (${{ github.sha }}) [skip ci]"
          git push -f origin HEAD:ci-results
